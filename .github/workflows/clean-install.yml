name: clean-install

on:
  push:
  pull_request:

jobs:
  platform-install:
    name: ${{ matrix.platform }} clean install
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fedora
            image: fedora:latest
          - platform: debian
            image: debian:bookworm
    steps:
      - name: Install bootstrap tools
        shell: bash
        run: |
          set -euxo pipefail
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y ca-certificates curl tar
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl tar
          fi
      - name: Artifact-first bootstrap from empty directory
        shell: bash
        env:
          FLOSSWARE_INSTALL_ROOT: /tmp/flossware-ai
          BOOTSTRAP_REF: ${{ github.head_ref || github.ref_name }}
          FLOSSWARE_RELEASE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euxo pipefail
          mkdir -p /workspace/empty-home
          cd /workspace/empty-home
          test ! -e .git
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BOOTSTRAP_REF}/install.sh" -o install.sh
          chmod +x install.sh
          ./install.sh --profile default
          test ! -d /tmp/flossware-ai/coding-agent-setup/.git
          test -f /tmp/flossware-ai/coding-agent-setup/profiles/default.toml
          test -f /tmp/flossware-ai/venv/lib/python*/site-packages/flossware_setup/profiles/default.toml || test -f /tmp/flossware-ai/venv/lib/python*/site-packages/flossware_setup/profiles/default.toml
          test -x /tmp/flossware-ai/bin/flossware-ai
          test -f /tmp/flossware-ai/state/active-profile
          test "$(cat /tmp/flossware-ai/state/active-profile)" = default
      - name: Run installed acceptance checks
        shell: bash
        env:
          FLOSSWARE_INSTALL_ROOT: /tmp/flossware-ai
        run: |
          set -euxo pipefail
          /tmp/flossware-ai/venv/bin/python -c 'from importlib import resources; import tomllib; p=resources.files("flossware_setup.profiles").joinpath("default.toml"); assert p.is_file(); tomllib.loads(p.read_text())'
          /tmp/flossware-ai/venv/bin/python /tmp/flossware-ai/dogfood.py
          /tmp/flossware-ai/bin/flossware-ai doctor
          /tmp/flossware-ai/bin/flossware-ai agents
          /tmp/flossware-ai/bin/flossware-ai components
          /tmp/flossware-ai/bin/flossware-ai config validate
          /tmp/flossware-ai/bin/flossware-ai config order show
          /tmp/flossware-ai/bin/flossware-ai config explain provider
          /tmp/flossware-ai/bin/flossware-ai demo > /tmp/flossware-demo.txt
          grep -q "PASS" /tmp/flossware-demo.txt
      - name: Explicit source fallback
        shell: bash
        env:
          FLOSSWARE_INSTALL_ROOT: /tmp/flossware-source
          FLOSSWARE_RELEASE_REF: ${{ github.head_ref || github.ref_name }}
          FLOSSWARE_USE_SOURCE: "true"
        run: |
          set -euxo pipefail
          rm -rf /tmp/flossware-source
          mkdir -p /workspace/source-fallback
          cd /workspace/source-fallback
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${FLOSSWARE_RELEASE_REF}/install.sh" -o install.sh
          chmod +x install.sh
          ./install.sh --profile default
          test -d /tmp/flossware-source/coding-agent-setup/.git
      - name: Verify reinstall boundary
        shell: bash
        env:
          FLOSSWARE_INSTALL_ROOT: /tmp/flossware-ai
          FLOSSWARE_RELEASE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euxo pipefail
          cd /workspace/empty-home
          ./install.sh --reinstall --profile default
          test ! -d /tmp/flossware-ai/coding-agent-setup/.git
          test -f /tmp/flossware-ai/coding-agent-setup/profiles/default.toml
          test -f /tmp/flossware-ai/state/active-profile
          test "$(cat /tmp/flossware-ai/state/active-profile)" = default
      - name: Verify clean boundary
        shell: bash
        env:
          FLOSSWARE_INSTALL_ROOT: /tmp/flossware-ai
        run: |
          set -euxo pipefail
          cd /workspace/empty-home
          ./install.sh --clean
          test ! -e /tmp/flossware-ai
