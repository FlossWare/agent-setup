name: Integrate installer metadata fix

on:
  push:
    branches: [fix/installation-release-metadata]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate metadata writer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/install.sh')
          s = p.read_text()
          marker = 'chmod 700 "$PATH_SHIM"\n'
          call = '"$SETUP_DIR/scripts/write-install-metadata.sh" "$INSTALL_ROOT" "$RELEASE_REF" "$USE_SOURCE" "$PLATFORM" "$PROFILE"\n'
          if call not in s:
              if marker not in s:
                  raise SystemExit('installer integration marker not found')
              s = s.replace(marker, call + marker, 1)
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/install.sh
          git diff --cached --quiet || git commit -m 'fix: persist installation provenance metadata'
          git push
