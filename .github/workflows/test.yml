name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q scripts
      - name: Install test dependencies
        run: python -m pip install pytest build
      - name: Build Python package
        run: python -m build
      - name: Install Windows curses support
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install windows-curses
      - name: Run offline smoke tests
        run: pytest -q
      - name: Verify POSIX installer
        if: runner.os != 'Windows'
        run: test -x scripts/install.sh
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path scripts/install.ps1)) { throw 'install.ps1 missing' }
