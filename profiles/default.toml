# Neutral baseline used when no named profile is selected.
# This profile is intentionally provider-neutral and requires no credentials.
# Users and organizations may optionally create named profiles such as
# personal, redhat, work, or government; no named profile is required.
profile = "default"

[model_policy]
# Use providers that the user has explicitly configured.
allowed_providers = ["*configured*"]
credential_env = []
allow_local_models = true
allow_unconfigured_providers = false

[flossware]
router = true
resilience = true
consensus = true
evaluation = true
observability = true
security = true
