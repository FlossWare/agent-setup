# Conservative work profile template.
# This is a user/organization policy template, not an official Red Hat policy artifact.
# Never put credential values or PII in this file.
profile = "redhat-cost-conscious"

[model_policy]
allowed_providers = ["anthropic"]
credential_env = []
allow_local_models = true
allow_unconfigured_providers = false
allow_personal_accounts = false
allow_provider_fallback = false
require_model_allowlist = true

[cost]
monthly_limit_usd = 300.0
hard_limit = true
warning_percent = 50
critical_percent = 80
max_request_cost_usd = 2.0
prefer_lowest_cost_approved_model = true
require_cost_estimate = true

[optimization]
enabled = true
strategy = "hybrid"

[optimization.thompson]
enabled = true
persist_prompt_content = false

[optimization.genetic]
enabled = true
max_generations = 20
population_size = 30

[credentials]
persist_secrets = false
persist_tokens = false
persist_api_keys = false

[logging]
log_prompts = false
log_responses = false
log_credentials = false
log_tokens = false
