# FlossWare Red Hat policy profile.
# No credential values belong in this file.
profile = "redhat"

[model_policy]
allowed_providers = ["anthropic"]
credential_env = ["ANTHROPIC_API_KEY"]
allow_local_models = false
allow_unconfigured_providers = false

[flossware]
router = true
resilience = true
consensus = true
evaluation = true
observability = true
security = true
