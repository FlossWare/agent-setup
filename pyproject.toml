[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-setup"
version = "0.1.0"
description = "Provider-neutral control plane and Setup TUI for configuring AI coding agents with FlossWare capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["flossware_setup*"]

[project.scripts]
flossware-setup = "flossware_setup.tui:main"

[project.optional-dependencies]
core = [
    "curses-themes @ git+https://github.com/FlossWare/curses-themes.git@b611725c54fd6aab8170e6e1735fc818127065ac",
    "model-router-ai @ git+https://github.com/FlossWare/model-router-ai.git@e35f2cca34a34683a7a02b74d673012f122279c1",
    "resilience-ai @ git+https://github.com/FlossWare/resilience-ai.git@b4a11f80bfe4b9a879b95b724d143d92cb548c47",
    "structured-output-ai @ git+https://github.com/FlossWare/structured-output-ai.git@9584f13877afa60307a9f9bca950caef0ff3b542",
]
all = [
    "curses-themes @ git+https://github.com/FlossWare/curses-themes.git@b611725c54fd6aab8170e6e1735fc818127065ac",
    "model-router-ai @ git+https://github.com/FlossWare/model-router-ai.git@e35f2cca34a34683a7a02b74d673012f122279c1",
    "resilience-ai @ git+https://github.com/FlossWare/resilience-ai.git@b4a11f80bfe4b9a879b95b724d143d92cb548c47",
    "structured-output-ai @ git+https://github.com/FlossWare/structured-output-ai.git@9584f13877afa60307a9f9bca950caef0ff3b542",
    "consensus-ai @ git+https://github.com/FlossWare/consensus-ai.git@8a7c76893b76b26e097dffe4db578b64f0238996",
    "evaluation-ai @ git+https://github.com/FlossWare/evaluation-ai.git@790d56dfb87c704a215253c94ee97408cc3dba51",
    "observability-ai @ git+https://github.com/FlossWare/observability-ai.git@f2bf65b8d2318594727d6e7641eba897b07f201a",
    "security-ai @ git+https://github.com/FlossWare/security-ai.git@7a19820af85af14818773ba579e42d8943654365",
    "rag-ai @ git+https://github.com/FlossWare/rag-ai.git@3534aa7abab46c86cfc75366c6143a346851bc74",
    "genetic-optimizer-ai @ git+https://github.com/FlossWare/genetic-optimizer-ai.git@8362844a46d7bbe26dcbff769c349ad24f863b7c",
]

[project.urls]
Homepage = "https://github.com/FlossWare/coding-agent-setup"
Repository = "https://github.com/FlossWare/coding-agent-setup"
