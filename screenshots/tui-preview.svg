<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1500" viewBox="0 0 1100 1500">
<rect width="1100" height="1500" fill="#111827"/>
<text x="55" y="55" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f9fafb">FlossWare AI Setup TUI</text>
<text x="55" y="84" font-family="sans-serif" font-size="15" fill="#9ca3af">Representative current curses UI. Keyboard + mouse movement + primary click.</text>
<g font-family="monospace" font-size="17" fill="#e5e7eb">
<rect x="45" y="115" width="1010" height="335" rx="10" fill="#0b1220" stroke="#374151"/>
<text x="70" y="150" fill="#f9fafb" font-weight="bold">SETUP CONTROL CENTER</text>
<text x="70" y="185">&gt; Review Current Configuration</text>
<text x="70" y="215">  Inspect persisted project configuration</text>
<text x="70" y="260">  Configure / Change Setup</text>
<text x="70" y="290">  Select agents, capabilities and budget</text>
<text x="70" y="335">  Provider Credentials</text>
<text x="70" y="365">  View detected credential sources (names only)</text>
<text x="70" y="400">  Exit</text>
<text x="70" y="430" fill="#67e8f9" font-weight="bold">STATUS: Review | inspect persisted project configuration | secret-free</text>

<rect x="45" y="480" width="1010" height="330" rx="10" fill="#0b1220" stroke="#374151"/>
<text x="70" y="515" fill="#f9fafb" font-weight="bold">SELECT CODING AGENTS</text>
<text x="70" y="555">&gt; [x] Claude Code</text>
<text x="70" y="585">  [x] Cursor</text>
<text x="70" y="615">  [ ] OpenCode</text>
<text x="70" y="645">  [ ] Crush</text>
<text x="70" y="675">  [ ] Codex</text>
<text x="70" y="705">  ... 13 catalog integrations total</text>
<text x="70" y="745" fill="#67e8f9" font-weight="bold">STATUS: Claude Code | Anthropic project instructions</text>
<text x="70" y="780">Mouse movement/↑↓ changes status; click/Space toggles; Enter confirms.</text>

<rect x="45" y="840" width="1010" height="300" rx="10" fill="#0b1220" stroke="#374151"/>
<text x="70" y="875" fill="#f9fafb" font-weight="bold">FLOSSWARE AI CAPABILITIES</text>
<text x="70" y="915">&gt; [x] model-router-ai</text>
<text x="70" y="945">  [x] resilience-ai</text>
<text x="70" y="975">  [x] structured-output-ai</text>
<text x="70" y="1005">  [ ] consensus-ai</text>
<text x="70" y="1035">  [ ] evaluation-ai</text>
<text x="70" y="1065">  [ ] observability-ai</text>
<text x="70" y="1100" fill="#67e8f9" font-weight="bold">STATUS: model-router-ai | LLM routing, provider failover, capability and cost awareness</text>

<rect x="45" y="1170" width="1010" height="250" rx="10" fill="#0b1220" stroke="#374151"/>
