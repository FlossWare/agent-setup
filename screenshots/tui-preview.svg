<text x="70" y="1245">Configuration generated successfully.</text>
<text x="70" y="1285">No credential values were written to generated files.</text>
<text x="70" y="1325">Active project: /path/to/project</text>
<text x="70" y="1365">Review Current Configuration uses the active project.</text>
<text x="70" y="1405">Status text is informational and never contains secrets.</text>
</g>
