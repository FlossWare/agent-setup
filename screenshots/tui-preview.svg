<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1500" viewBox="0 0 1100 1500">
<rect width="1100" height="1500" fill="#111827"/>
<text x="55" y="55" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f9fafb">FlossWare AI Setup TUI</text>
<text x="55" y="84" font-family="sans-serif" font-size="15" fill="#9ca3af">Representative documentation rendering of the current curses UI. Keyboard + primary mouse click.</text>
<g font-family="monospace" font-size="17" fill="#e5e7eb">
<rect x="45" y="115" width="1010" height="300" rx="10" fill="#0b1220" stroke="#374151"/>
<text x="70" y="150" fill="#f9fafb" font-weight="bold">SETUP CONTROL CENTER</text>
<text x="70" y="185">&gt; Review Current Configuration</text>
<text x="70" y="215">  Inspect persisted project configuration</text>
<text x="70" y="260">  Configure / Change Setup</text>
<text x="70" y="290">  Select agents, capabilities and budget</text>
<text x="70" y="335">  Provider Credentials</text>
<text x="70" y="365">  View detected credential sources (names only)</text>
<text x="70" y="400">  Exit</text>

<rect x="45" y="445" width="1010" height="300" rx="10" fill="#0b1220" stroke="#374151"/>
<text x="70" y="480" fill="#f9fafb" font-weight="bold">SELECT CODING AGENTS</text>
<text x="70" y="520">&gt; [x] Claude Code</text>
<text x="70" y="550">  [x] Cursor</text>
<text x="70" y="580">  [ ] OpenCode</text>
<text x="70" y="610">  [ ] Crush</text>
<text x="70" y="640">  [ ] Codex</text>
<text x="70" y="680">  ... 13 catalog integrations total</text>
<text x="70" y="715">Space: toggle   Enter: confirm   a: all   n: none   Mouse: click</text>

<rect x="45" y="775" width="1010" height="300" rx="10" fill="#0b1220" stroke="#374151"/>
<text x="70" y="810" fill="#f9fafb" font-weight="bold">FLOSSWARE AI CAPABILITIES</text>
<text x="70" y="850">&gt; [x] model-router-ai</text>
<text x="70" y="880">  [x] resilience-ai</text>
<text x="70" y="910">  [x] structured-output-ai</text>
<text x="70" y="940">  [ ] consensus-ai</text>
<text x="70" y="970">  [ ] evaluation-ai</text>
<text x="70" y="1000">  [ ] observability-ai</text>
<text x="70" y="1035">Selection persists stable capability IDs.</text>

<rect x="45" y="1105" width="1010" height="300" rx="10" fill="#0b1220" stroke="#374151"/>
<text x="70" y="1140" fill="#f9fafb" font-weight="bold">SETUP COMPLETE</text>
<text x="70" y="1180">Configuration generated successfully.</text>
<text x="70" y="1220">No credential values were written to generated files.</text>
<text x="70" y="1260">Active project: /path/to/project</text>
<text x="70" y="1300">Review Current Configuration uses the active project.</text>
<text x="70" y="1360">Press any key to continue.</text>
</g>
</svg>
